<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;gridTemplateColumns:repeat(auto-fit, minmax(120px, 1fr));gap:var(--space-4);padding:var(--space-4) 0">
  <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
    <div style="display:flex;flexDirection:column;gap:2px">
      <span style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:28px;color:var(--color-accent)">{{s.value}}</span>
      <span style="fontSize:13px;opacity:0.7">{{s.label}}</span>
    </div>
  </sc-for>
</div>
</x-dc>
</body>
</html>
