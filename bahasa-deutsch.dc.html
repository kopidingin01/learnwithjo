<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/broadsheet.css">
</helmet>
<div style="background:var(--color-bg);color:var(--color-text);minHeight:100vh;display:flex;flexDirection:column">
  <dc-import name="SiteNav" active="bahasa-deutsch" lang="{{lang}}" on-toggle-lang="{{toggleLang}}" hint-size="100%,60px"></dc-import>
  <main style="maxWidth:1180px;margin:0 auto;padding:var(--space-8) var(--space-4);width:100%;boxSizing:border-box;display:flex;flexDirection:column;gap:var(--space-6)">
    <section style="display:flex;flexDirection:column;gap:var(--space-2);maxWidth:640px;borderTop:3px solid var(--color-accent);paddingTop:var(--space-4)">
      <span style="fontSize:12px;letterSpacing:0.1em;textTransform:uppercase;color:var(--color-accent)">{{kicker}}</span>
      <h1 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:36px;margin:0">Deutsch</h1>
      <p style="fontSize:16px;opacity:0.8">{{desc}}</p>
      <a href="deutsch-skills.dc.html" style="fontSize:14px;color:var(--color-accent)">{{skillsLink}} →</a>
    </section>
    <dc-import name="MateriDetail" concept-nodes="{{materiConceptNodes}}" concept-mindset="{{materiConceptMindset}}" steps="{{materiSteps}}" terms="{{materiTerms}}" project="{{materiProject}}" lang="{{lang}}" hint-size="100%,600px"></dc-import>
    <h2 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:22px;margin:0">{{articlesTitle}}</h2>
    <dc-import name="ArticleGrid" articles="{{articles}}" tags="{{tags}}" lang="{{lang}}" hint-size="100%,400px"></dc-import>
  </main>
  <dc-import name="SiteFooter" lang="{{lang}}" hint-size="100%,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'id', articles: [], tags: [], materi: { steps: [], terms: [], project: {} } };
  componentDidMount() {
    import('./content.js').then((mod) => {
      this.mod = mod;
      this.setState({ lang: mod.langHelpers.getLang(), articles: mod.articles.deutsch, tags: mod.tags.deutsch, materi: mod.materi.deutsch });
    });
  }
  toggleLang = () => {
    const next = this.state.lang === 'en' ? 'id' : 'en';
    if (this.mod) this.mod.langHelpers.setLang(next);
    this.setState({ lang: next });
  };
  renderVals() {
    const en = this.state.lang === 'en';
    return {
      lang: this.state.lang, toggleLang: this.toggleLang, articles: this.state.articles, tags: this.state.tags,
      materiSteps: this.state.materi.steps, materiTerms: this.state.materi.terms, materiProject: this.state.materi.project,
      materiConceptNodes: this.state.materi.concept ? this.state.materi.concept.nodes : [], materiConceptMindset: this.state.materi.concept ? this.state.materi.concept.mindset : '',
      articlesTitle: en ? 'Articles' : 'Artikel',
      kicker: en ? 'Category' : 'Kategori',
      desc: en ? 'German grammar, words, and getting through first real conversations.' : 'Grammatik, kosakata Deutsch, dan bertahan di percakapan pertama.',
      skillsLink: en ? 'Full skill-by-skill breakdown with practice questions' : 'Rincian lengkap per skill dengan contoh soal'
    };
  }
}
</script>
</body>
</html>
