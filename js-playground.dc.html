<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/broadsheet.css">
</helmet>
<div style="background:var(--color-bg);color:var(--color-text);minHeight:100vh;display:flex;flexDirection:column">
  <dc-import name="SiteNav" active="web-development" lang="{{lang}}" on-toggle-lang="{{toggleLang}}" hint-size="100%,60px"></dc-import>
  <main style="maxWidth:1000px;margin:0 auto;padding:var(--space-8) var(--space-4);width:100%;boxSizing:border-box;display:flex;flexDirection:column;gap:var(--space-8)">
    <a href="web-development.dc.html" style="fontSize:13px;color:var(--color-accent)">{{backLabel}}</a>
    <div style="display:flex;flexDirection:column;gap:var(--space-2);borderTop:3px solid var(--color-accent-2);paddingTop:var(--space-4)">
      <span style="fontSize:12px;letterSpacing:0.1em;textTransform:uppercase;color:var(--color-accent-2)">{{kicker}}</span>
      <h1 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:36px;margin:0">{{title}}</h1>
      <p style="fontSize:16px;opacity:0.8;maxWidth:640px">{{desc}}</p>
    </div>

    <nav style="display:flex;gap:8px;flexWrap:wrap">
      <sc-for list="{{navItems}}" as="n" hint-placeholder-count="20">
        <a href="{{n.href}}" class="tag tag-outline" style="textDecoration:none;whiteSpace:nowrap">{{n.label}}</a>
      </sc-for>
    </nav>

    <sc-for list="{{topics}}" as="t" hint-placeholder-count="20">
      <section id="{{t.key}}" style="display:flex;flexDirection:column;gap:var(--space-3)">
        <h2 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:22px;margin:0">{{t.label}}</h2>
        <p style="fontSize:14px;lineHeight:1.6;opacity:0.8;maxWidth:640px">{{t.explanation}}</p>
        <dc-import name="JsPlayground" initial-code="{{t.initialCode}}" lang="{{lang}}" hint-size="100%,340px"></dc-import>
      </section>
    </sc-for>

    <section id="cheatsheet" style="display:flex;flexDirection:column;gap:var(--space-3)">
      <h2 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:22px;margin:0">{{cheatTitle}}</h2>
      <p style="fontSize:14px;lineHeight:1.6;opacity:0.8;maxWidth:640px">{{cheatDesc}}</p>
      <dc-import name="CssCheatSheet" rows="{{cheatRows}}" lang="{{lang}}" hint-size="100%,500px"></dc-import>
    </section>

    <section id="oneminute" style="display:flex;flexDirection:column;gap:var(--space-3)">
      <h2 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:22px;margin:0">{{oneMinuteTitle}}</h2>
      <p style="fontSize:14px;lineHeight:1.6;opacity:0.8;maxWidth:640px">{{oneMinuteDesc}}</p>
      <dc-import name="OneMinuteCards" cards="{{oneMinuteCards}}" lang="{{lang}}" hint-size="100%,300px"></dc-import>
    </section>
  </main>
  <dc-import name="SiteFooter" lang="{{lang}}" hint-size="100%,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'id', topics: [], cheatRows: [], oneMinuteCards: [] };
  componentDidMount() {
    import('./content.js').then((mod) => {
      this.mod = mod;
      this.setState({ lang: mod.langHelpers.getLang(), topics: mod.jsPlayground.topics, cheatRows: mod.jsPlayground.cheatSheet, oneMinuteCards: mod.jsPlayground.oneMinute });
    });
  }
  toggleLang = () => {
    const next = this.state.lang === 'en' ? 'id' : 'en';
    if (this.mod) this.mod.langHelpers.setLang(next);
    this.setState({ lang: next });
  };
  renderVals() {
    const en = this.state.lang === 'en';
    const navItems = [...this.state.topics.map((t) => ({ href: '#' + t.key, label: t.label })), { href: '#cheatsheet', label: 'Cheat Sheet' }, { href: '#oneminute', label: en ? 'JS in 2 Minutes' : 'JS dalam 2 Menit' }];
    return {
      lang: this.state.lang, toggleLang: this.toggleLang, topics: this.state.topics, navItems,
      cheatRows: this.state.cheatRows, oneMinuteCards: this.state.oneMinuteCards,
      backLabel: en ? '\u2190 Back to Web Development' : '\u2190 Kembali ke Web Development',
      kicker: en ? 'JavaScript deep dive' : 'Pendalaman JavaScript',
      title: en ? 'JavaScript Playground' : 'Playground JavaScript',
      desc: en ? '20 essential JavaScript topics \u2014 variables, functions, conditions, loops, and more \u2014 each with a live console playground, plus a cheat sheet and 20 key concept cards.' : '20 materi JavaScript yang wajib dikuasai \u2014 variabel, fungsi, kondisi, perulangan, dan lainnya \u2014 masing-masing dengan playground console live, plus cheat sheet dan 20 kartu konsep penting.',
      cheatTitle: 'JavaScript Cheat Sheet',
      cheatDesc: en ? 'The most commonly used JavaScript syntax. Filter by category, then copy the example.' : 'Sintaks JavaScript yang paling sering dipakai. Filter per kategori, lalu copy contohnya.',
      oneMinuteTitle: en ? 'JavaScript Key Concepts' : 'JavaScript dalam 2 Menit',
      oneMinuteDesc: en ? '20 key JavaScript concepts as quick cards \u2014 read at a glance.' : '20 konsep penting JavaScript dalam kartu singkat \u2014 baca sekilas.'
    };
  }
}
</script>
</body>
</html>
