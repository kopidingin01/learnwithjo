<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/broadsheet.css">
</helmet>
<div style="background:var(--color-bg);color:var(--color-text);minHeight:100vh;display:flex;flexDirection:column">
  <dc-import name="SiteNav" active="bahasa-spanish" lang="{{lang}}" on-toggle-lang="{{toggleLang}}" hint-size="100%,60px"></dc-import>
  <main style="maxWidth:820px;margin:0 auto;padding:var(--space-8) var(--space-4);width:100%;boxSizing:border-box;display:flex;flexDirection:column;gap:var(--space-6)">
    <a href="bahasa-spanish.dc.html" style="fontSize:13px;color:var(--color-accent)">{{backLabel}}</a>
    <div style="display:flex;flexDirection:column;gap:var(--space-2);borderTop:3px solid var(--color-accent-2);paddingTop:var(--space-4)">
      <span style="fontSize:12px;letterSpacing:0.1em;textTransform:uppercase;color:var(--color-accent-2)">{{kicker}}</span>
      <h1 style="fontFamily:var(--font-heading);fontWeight:var(--font-heading-weight);fontSize:34px;margin:0">Spanish — {{sectionsLabel}}</h1>
      <p style="fontSize:15px;opacity:0.75">{{desc}}</p>
    </div>
    <dc-import name="LanguageSkills" sections="{{sections}}" lang="{{lang}}" hint-size="100%,600px"></dc-import>
  </main>
  <dc-import name="SiteFooter" lang="{{lang}}" hint-size="100%,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'id', sections: [] };
  componentDidMount() {
    import('./content.js').then((mod) => {
      this.mod = mod;
      this.setState({ lang: mod.langHelpers.getLang(), sections: mod.skills.spanish });
    });
  }
  toggleLang = () => {
    const next = this.state.lang === 'en' ? 'id' : 'en';
    if (this.mod) this.mod.langHelpers.setLang(next);
    this.setState({ lang: next });
  };
  renderVals() {
    const en = this.state.lang === 'en';
    return {
      lang: this.state.lang, toggleLang: this.toggleLang, sections: this.state.sections,
      backLabel: en ? '\u2190 Back to Spanish' : '\u2190 Kembali ke Spanish',
      kicker: en ? 'Skill-by-skill breakdown' : 'Rincian per skill',
      sectionsLabel: en ? 'Reading, Listening, Speaking, Writing & Grammar' : 'Lectura, Comprensión auditiva, Expresión oral, Expresión escrita & Gramática',
      desc: en ? 'A closer look at each language skill: what to focus on, and original beginner-level practice questions in the DELE exam style \u2014 not copied from actual test papers.' : 'Rincian tiap skill bahasa Spanish: apa yang perlu difokuskan, dan contoh soal orisinal level pemula dengan gaya ujian DELE \u2014 bukan hasil menyalin dari naskah ujian resmi.'
    };
  }
}
</script>
</body>
</html>
